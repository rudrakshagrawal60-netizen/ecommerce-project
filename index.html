<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Engine Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="border-b border-slate-700 pb-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-400">E-Commerce Management Dashboard</h1>
            <span id="cart-count" class="bg-blue-600 text-white px-3 py-1 rounded-full text-sm font-semibold">
                Cart Items: 0
            </span>
        </header>
        
        <!-- Admin Add Product Form -->
<div class="bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-3 mb-6">
  <h2 class="text-lg font-semibold text-slate-200">Admin: Add New Product</h2>
  <div class="flex gap-2">
    <input id="prod-name" type="text" placeholder="Product Name" class="bg-slate-900 border border-slate-700 text-white px-3 py-2 rounded w-full focus:outline-none">
    <input id="prod-price" type="number" placeholder="Price ($)" class="bg-slate-900 border border-slate-700 text-white px-3 py-2 rounded w-1/3 focus:outline-none">
    <button onclick="addNewProduct()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded font-semibold">Add</button>
  </div>
</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Catalog Section -->
            <div class="space-y-4">
                <h2 class="text-xl font-semibold text-slate-200">Catalog</h2>
                <div id="product-list" class="space-y-3"></div>
            </div>

            <!-- Order Summary Section -->
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-4">
                <h2 class="text-xl font-semibold text-slate-200">Order Summary</h2>
                <ul id="cart-list" class="space-y-2 divide-y divide-slate-700">
                    <p id="empty-msg" class="text-slate-400 text-sm">Cart is currently empty.</p>
                </ul>
                <div class="border-t border-slate-700 pt-3 flex justify-between font-bold text-lg">
                    <span>Total:</span>
                    <span id="cart-total" class="text-green-400">$0.00</span>
                </div>
                <button onclick="checkoutCart()" class="w-full mt-4 bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded">
  Checkout & Pay
</button>
            </div>
        </div>
    </div>

   <script>
  let cart = [];

  // Initial Fetch Catalog
  document.addEventListener("DOMContentLoaded", () => {
    fetchCatalog();
  });

  function fetchCatalog() {
    fetch('https://ecommerce-project-94ex.onrender.com/api/products')
      .then(res => res.json())
      .then(data => renderProducts(data))
      .catch(err => console.error('Error fetching catalog:', err));
  }

  // Render Catalog
  function renderProducts(products) {
    const container = document.getElementById('product-list');
    if (!products || products.length === 0) {
      container.innerHTML = `<p class="text-slate-400">No products available.</p>`;
      return;
    }
    container.innerHTML = products.map(p => `
      <div class="flex justify-between items-center bg-slate-800 p-3 rounded border border-slate-700">
        <div>
          <h3 class="font-semibold text-slate-100">${p.name}</h3>
          <p class="text-sm text-slate-400">$${p.price.toFixed(2)}</p>
        </div>
        <div class="flex gap-2">
          <button onclick="addToCart('${p.name}', ${p.price})" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-sm">Add to Cart</button>
          <button onclick="deleteProduct(${p.id})" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded text-sm">Delete</button>
        </div>
      </div>
    `).join('');
  }

  // Add Product Function
  function addNewProduct() {
    const name = document.getElementById('prod-name').value;
    const price = parseFloat(document.getElementById('prod-price').value);

    if (!name || isNaN(price)) {
      alert('Please enter a valid product name and price');
      return;
    }

    fetch('https://ecommerce-project-94ex.onrender.com/api/products', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, price: price })
    })
    .then(res => res.json())
    .then(() => {
      document.getElementById('prod-name').value = '';
      document.getElementById('prod-price').value = '';
      fetchCatalog();
    })
    .catch(err => alert('Error adding product!'));
  }

  // Delete Product Function
  function deleteProduct(productId) {
    if (!confirm('Are you sure you want to delete this product?')) return;

    fetch(`https://ecommerce-project-94ex.onrender.com/api/products/${productId}`, {
      method: 'DELETE'
    })
    .then(res => res.json())
    .then(() => fetchCatalog());
  }

  // Cart Functions
  function addToCart(name, price) {
    cart.push({ name, price });
    updateCart();
  }

  function updateCart() {
    const cartList = document.getElementById('cart-list');
    document.getElementById('cart-count').innerText = `Cart Items: ${cart.length}`;
    
    if (cart.length === 0) {
      cartList.innerHTML = `<p id="empty-msg" class="text-slate-400 text-sm">Cart is currently empty.</p>`;
      document.getElementById('cart-total').innerText = '$0.00';
      return;
    }

    cartList.innerHTML = cart.map(item => `
      <li class="pt-2 flex justify-between text-sm">
        <span>${item.name}</span>
        <span class="font-mono text-blue-400">$${item.price.toFixed(2)}</span>
      </li>
    `).join('');

    const total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
  }

  // Checkout Function
  function checkoutCart() {
    if (cart.length === 0) {
      alert("Cart is empty!");
      return;
    }

    const totalAmount = cart.reduce((sum, item) => sum + item.price, 0);
    const itemsList = cart.map(i => i.name).join(", ");

    fetch('https://ecommerce-project-94ex.onrender.com/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        customer_name: "Test Customer",
        amount: totalAmount,
        items: itemsList
      })
    })
    .then(res => res.json())
    .then(() => {
      alert("Payment Successful! Order Placed.");
      cart = [];
      updateCart();
    })
    .catch(err => {
      alert("Error placing order!");
      console.error(err);
    });
  }
</script>
